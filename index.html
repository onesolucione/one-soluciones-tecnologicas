<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ONE | Soluciones Tecnológicas Integrales</title>

    <meta
        name="description"
        content="ONE Soluciones Tecnológicas Integrales. Tecnología, conectividad y soluciones para personas, hogares y empresas."
    >

    <meta name="theme-color" content="#080808">

    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #080808;
            color: #ffffff;

            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .container {
            width: min(1120px, 92%);
            margin: 0 auto;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(8, 8, 8, 0.94);

            border-bottom: 1px solid #222;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        nav {
            min-height: 82px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 25px;
        }

        .logo-link {
            display: flex;
            align-items: center;
        }

        .logo-image {
            width: 105px;
            height: auto;

            object-fit: contain;
        }

        .nav-links {
            display: flex;

            align-items: center;

            gap: 28px;

            list-style: none;

            font-size: 14px;
        }

        .nav-links a {
            color: #bdbdbd;

            transition:
                color 0.3s ease,
                transform 0.3s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .nav-contact {
            padding: 10px 18px;

            border: 1px solid #444;

            border-radius: 4px;

            color: #ffffff !important;
        }

        .nav-contact:hover {
            border-color: #ffffff;
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            min-height: calc(100vh - 82px);

            display: flex;

            align-items: center;

            position: relative;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 82% 28%,
                    rgba(255, 125, 0, 0.10),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 20% 75%,
                    rgba(255, 255, 255, 0.045),
                    transparent 30%
                ),

                #080808;
        }

        .hero::after {
            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            right: -250px;
            bottom: -250px;

            background: rgba(255, 125, 0, 0.04);

            border-radius: 50%;

            filter: blur(40px);

            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;

            max-width: 900px;

            padding: 100px 0;
        }

        .eyebrow {
            text-transform: uppercase;

            letter-spacing: 5px;

            color: #888;

            font-size: 12px;

            margin-bottom: 25px;
        }

        .eyebrow span {
            color: #ff7a00;
        }

        h1 {
            font-size: clamp(48px, 9vw, 94px);

            line-height: 0.98;

            letter-spacing: -5px;

            margin-bottom: 35px;
        }

        h1 .white {
            color: #ffffff;
        }

        h1 .gray {
            color: #888888;
        }

        .hero-text {
            max-width: 680px;

            color: #b7b7b7;

            font-size: 20px;

            line-height: 1.7;

            margin-bottom: 42px;
        }

        .buttons {
            display: flex;

            flex-wrap: wrap;

            gap: 15px;
        }

        .button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 15px 25px;

            min-height: 52px;

            border: 1px solid #444;

            border-radius: 4px;

            font-weight: 600;

            transition:
                transform 0.3s ease,
                border-color 0.3s ease,
                background 0.3s ease;
        }

        .button.primary {
            background: #ffffff;

            color: #000000;

            border-color: #ffffff;
        }

        .button.secondary {
            background: transparent;

            color: #ffffff;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        .button.secondary:hover {
            border-color: #ffffff;
        }


        /* =====================================================
           SECCIONES
        ===================================================== */

        section {
            padding: 110px 0;

            border-top: 1px solid #181818;
        }

        .section-label {
            color: #777;

            text-transform: uppercase;

            letter-spacing: 4px;

            font-size: 11px;

            margin-bottom: 16px;
        }

        .section-label span {
            color: #ff7a00;
        }

        h2 {
            font-size: clamp(36px, 6vw, 60px);

            line-height: 1.05;

            letter-spacing: -2px;

            margin-bottom: 25px;
        }

        .intro {
            max-width: 760px;

            color: #a5a5a5;

            font-size: 18px;

            line-height: 1.8;
        }


        /* =====================================================
           SOLUCIONES
        ===================================================== */

        .services {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-top: 55px;
        }

        .service {
            min-height: 220px;

            padding: 30px;

            border: 1px solid #242424;

            background:
                linear-gradient(
                    145deg,
                    #101010,
                    #0b0b0b
                );

            transition:
                transform 0.3s ease,
                border-color 0.3s ease,
                background 0.3s ease;
        }

        .service:hover {
            transform: translateY(-5px);

            border-color: #4a4a4a;

            background:
                linear-gradient(
                    145deg,
                    #151515,
                    #0b0b0b
                );
        }

        .service-number {
            color: #ff7a00;

            font-size: 12px;

            letter-spacing: 2px;

            margin-bottom: 35px;
        }

        .service h3 {
            font-size: 20px;

            margin-bottom: 12px;
        }

        .service p {
            color: #858585;

            font-size: 14px;

            line-height: 1.7;
        }


        /* =====================================================
           NOSOTROS
        ===================================================== */

        .about-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 80px;

            align-items: start;
        }

        .about-text p {
            color: #aaa;

            margin-bottom: 20px;

            font-size: 17px;

            line-height: 1.8;
        }

        .principles {
            border-left: 1px solid #333;

            padding-left: 35px;
        }

        .principle {
            margin-bottom: 35px;
        }

        .principle:last-child {
            margin-bottom: 0;
        }

        .principle h3 {
            margin-bottom: 7px;

            font-size: 19px;
        }

        .principle
