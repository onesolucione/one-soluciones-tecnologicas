<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ONE Soluciones Tecnológicas Integrales</title>

    <meta name="description" content="ONE Soluciones Tecnológicas Integrales. Tecnología, conectividad y soluciones en un solo lugar.">

    <meta name="theme-color" content="#0a0a0a">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080808;
            color: #ffffff;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1120px, 92%);
            margin: auto;
        }

        /* NAVBAR */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(8, 8, 8, 0.94);
            border-bottom: 1px solid #222;
            backdrop-filter: blur(10px);
        }

        nav {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 4px;
        }

        .logo span {
            font-size: 11px;
            display: block;
            letter-spacing: 2px;
            color: #aaa;
            font-weight: 400;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
            font-size: 14px;
        }

        .nav-links a {
            color: #ccc;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #fff;
        }

        /* HERO */

        .hero {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 80% 30%, rgba(255,255,255,0.08), transparent 30%),
                radial-gradient(circle at 20% 80%, rgba(255,255,255,0.04), transparent 30%),
                #080808;
        }

        .hero-content {
            max-width: 850px;
            padding: 90px 0;
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #999;
            font-size: 13px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(48px, 9vw, 92px);
            line-height: 0.98;
            letter-spacing: -4px;
            margin-bottom: 30px;
        }

        h1 span {
            color: #aaa;
        }

        .hero p {
            max-width: 650px;
            color: #bbb;
            font-size: 20px;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .button {
            display: inline-block;
            padding: 14px 24px;
            border: 1px solid #444;
            border-radius: 4px;
            font-weight: 600;
            transition: 0.3s;
        }

        .button.primary {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        /* SECTIONS */

        section {
            padding: 100px 0;
            border-top: 1px solid #181818;
        }

        .section-label {
            color: #777;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 12px;
            margin-bottom: 15px;
        }

        h2 {
            font-size: clamp(34px, 5vw, 56px);
            line-height: 1.05;
            margin-bottom: 25px;
        }

        .intro {
            max-width: 720px;
            color: #aaa;
            font-size: 18px;
        }

        /* SERVICES */

        .services {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 50px;
        }

        .service {
            padding: 30px;
            min-height: 190px;
            border: 1px solid #242424;
            background: #0d0d0d;
            transition: 0.3s;
        }

        .service:hover {
            border-color: #555;
            transform: translateY(-4px);
        }

        .service-number {
            color: #666;
            font-size: 13px;
            margin-bottom: 35px;
        }

        .service h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .service p {
            color: #888;
            font-size: 14px;
        }

        /* ABOUT */

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
            align-items: start;
        }

        .about-text p {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 17px;
        }

        .principles {
            border-left: 1px solid #333;
            padding-left: 30px;
        }

        .principle {
            margin-bottom: 30px;
        }

        .principle h3 {
            margin-bottom: 5px;
        }

        .principle p {
            color: #888;
            font-size: 14px;
        }

        /* CONTACT */

        .contact-box {
            margin-top: 40px;
            padding: 50px;
            border: 1px solid #292929;
            background: #0d0d0d;
        }

        .contact-box p {
            color: #999;
            margin-bottom: 30px;
        }

        /* FOOTER */

        footer {
            padding: 50px 0;
            border-top: 1px solid #222;
            color: #777;
            font-size: 13px;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .nav-links {
                display: none;
            }

            .hero-content {
                padding: 70px 0;
            }

            h1 {
                letter-spacing: -2px;
            }

            .hero p {
                font-size: 17px;
            }

            section {
                padding: 75px 0;
            }

            .services {
                grid-template-columns: 1fr;
            }

            .about-grid {
                grid-template-columns: 1fr;
                gap: 45px;
            }

            .contact-box {
                padding: 30px;
            }
        }
    </style>
</head>

            <ul class="nav-links">
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#soluciones">Soluciones</a></li>
